# Serviços do projeto. O banco sobe sempre; o resto é ligado por profile.
#
#   local:     COMPOSE_PROFILES=...      só o banco (e o que mais quiser); a API roda com `make dev`
#   servidor:  COMPOSE_PROFILES=app,proxy,n8n   API, HTTPS (Caddy) e n8n
#
# O COMPOSE_PROFILES é lido do .env. Nada é publicado para a internet além do Caddy (80/443);
# o que expõe porta no host fica preso em 127.0.0.1.

name: rag-ingestao

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?rode `make env` para gerar o .env}
      POSTGRES_DB: ${POSTGRES_DB:-rag_ingestao}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?rode `make env` para gerar o .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts daqui só rodam na primeira vez, com o volume vazio.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    profiles: [app]
    build: .
    image: rag-ingestao:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_KEY: ${API_KEY:?rode `make env` para gerar o .env}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rag_ingestao}
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-local}
      LLM_PROVIDER: ${LLM_PROVIDER:-simulado}
      LLM_MODEL: ${LLM_MODEL:-}
      # O Ollama roda no computador, fora do Compose. LLM_BASE_URL do .env vale para a API local
      # (127.0.0.1) e não serve aqui dentro; por isso o nome próprio.
      LLM_BASE_URL: ${LLM_BASE_URL_DOCKER:-http://host.docker.internal:11434}
      HF_TOKEN: ${HF_TOKEN:-}   # opcional: eleva o limite de download do modelo
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - dados:/app/dados          # arquivos originais enviados
      - modelos:/app/modelos      # cache do modelo de embeddings (baixado na primeira vez)
    # Aplica as migrações antes de atender. Com uma única instância, isso basta.
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*

  caddy:
    profiles: [proxy]
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  n8n:
    profiles: [n8n]
    # Fixe uma versão depois do primeiro teste (N8N_VERSION no .env) para o deploy ser reproduzível.
    image: n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Banco próprio do n8n, no mesmo servidor Postgres (criado por infra/postgres/init).
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?rode `make env` para gerar o .env}
      # Cifra as credenciais guardadas. Se for perdida, as credenciais salvas ficam inúteis.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?rode `make env` para gerar o .env}
      N8N_EDITOR_BASE_URL: ${N8N_URL:-http://localhost:5678}
      N8N_WEBHOOK_URL: ${N8N_URL:-http://localhost:5678}/
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: ${TZ:-America/Sao_Paulo}
      TZ: ${TZ:-America/Sao_Paulo}
      # Fluxo da pasta de entrada (n8n/workflows/IngestaoPasta0001.json):
      #  - o nó de pasta vem desligado no n8n 2.x; NODES_EXCLUDE=[] o liga;
      #  - arquivos só podem ser lidos sob /files (padrão: ~/.n8n-files);
      #  - o fluxo lê a URL e a chave da API de $env, para o JSON não carregar segredos.
      NODES_EXCLUDE: "[]"
      N8N_RESTRICT_FILE_ACCESS_TO: /files
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      RAG_API_URL: ${RAG_API_URL:-http://api:8000}
      RAG_API_KEY: ${API_KEY:?rode `make env` para gerar o .env}
    # Permite alcançar a API que roda no computador (uvicorn local) como host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./dados/entrada:/files/entrada   # solte aqui os documentos a ingerir

volumes:
  pgdata:
  dados:
  modelos:
  caddy_data:
  caddy_config:
  n8n_data:
